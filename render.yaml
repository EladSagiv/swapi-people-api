services:
  - type: web
    name: swapi-people-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Secret: enter the value in the Render dashboard, never in this file.
      - key: API_KEY
        sync: false
